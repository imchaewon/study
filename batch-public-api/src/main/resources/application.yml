spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batch_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 시작 시 자동 실행 안 함

tour:
  api:
    service-key: YOUR_SERVICE_KEY_HERE  # 공공데이터포털에서 발급받은 키 입력
    base-url: http://apis.data.go.kr/B551011/KorService1
    num-of-rows: 100
