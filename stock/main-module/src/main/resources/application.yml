  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  flyway:
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: imchaewon26@gmail.com
    # 환경변수 MAIL_PASSWORD로 Gmail 앱 비밀번호(16자, 공백 제거) 주입.
    # 평문 commit 금지. 설정 안 하면 알림 비활성.
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

